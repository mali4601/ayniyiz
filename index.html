<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aynıyız</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f0f1a;color:white;text-align:center}
.container{padding:38px 20px;max-width:420px;margin:auto}
h1{font-size:34px;margin-top:30px}
p{color:#bbb;font-size:18px}
button,.option{width:100%;padding:18px;border:none;border-radius:14px;background:#ff8a00;color:#000;font-size:18px;font-weight:bold;margin-top:14px;cursor:pointer}
.option{background:#1f1f2e;color:white}
.box{display:none}
</style>
</head>
<body>
<div class="container">
  <div id="home">
    <h1>Gerçekten aynı mısınız?</h1>
    <p>Testi çöz, sana benzeyenleri bul</p>
    <button onclick="start()">Teste Başla</button>
  </div>

  <div id="test" class="box">
    <p id="progress"></p>
    <h1 id="q"></h1>
    <div id="a"></div>
  </div>

  <div id="result" class="box">
    <h1 id="type"></h1>
    <p id="count"></p>
    <button onclick="premium()">Onları Gör</button>
  </div>

  <div id="premium" class="box">
    <h1>Premium</h1>
    <p>Sana benzeyen kişileri görmek ve mesajlaşmak için Premium’a geç.</p>
    <button>7 Gün Ücretsiz Dene</button>
  </div>
</div>

<script>
let i = 0;
let score = 0;

const const qs = [
{q:"Yeni bir ortama girdiğinde nasılsın?", a:[["Hemen ortama girerim",3],["Ortamı izlerim",2],["Geri planda kalırım",1]]},

{q:"İnsanlarda ilk dikkat ettiğin şey?", a:[["Enerji",3],["Konuşma tarzı",2],["Görünüş",1]]},

{q:"Arkadaş grubunda rolün nedir?", a:[["Liderim",3],["Dengeleyiciyim",2],["Dinleyenim",1]]},

{q:"Boş zamanlarını nasıl geçirirsin?", a:[["Sosyal ortam",3],["Karışık",2],["Tek başıma",1]]},

{q:"Mesajlaşma alışkanlığın?", a:[["Hızlı cevap",3],["Normal",2],["Geç cevap",1]]},

{q:"İlişkide en önemli şey?", a:[["Tutku",3],["Güven",2],["Sakinlik",1]]},

{q:"Risk alır mısın?", a:[["Evet",3],["Duruma göre",2],["Hayır",1]]},

{q:"Tanımadığın biriyle sohbet?", a:[["Hemen başlarım",3],["Zamanla",2],["Zorlanırım",1]]},

{q:"Duygularını ifade etme şeklin?", a:[["Açık",3],["Bazen",2],["İçe atarım",1]]},

{q:"Kalabalık ortamlar?", a:[["Enerji verir",3],["Nötr",2],["Yorar",1]]},

{q:"Birini tanırken en çok neye bakarsın?", a:[["Karakter",3],["Uyum",2],["Dış görünüş",1]]},

{q:"Sosyal medyada nasılsın?", a:[["Aktifim",3],["Ara sıra",2],["Pasifim",1]]},

{q:"Karar verirken?", a:[["Hızlı",3],["Düşünerek",2],["Çok zor",1]]},

{q:"Flört ederken?", a:[["Cesurum",3],["Orta",2],["Çekingenim",1]]},

{q:"Hayata bakışın?", a:[["Enerjik",3],["Dengeli",2],["Sakin",1]]}
];

function hideAll(){
  document.getElementById("home").style.display="none";
  document.getElementById("test").style.display="none";
  document.getElementById("result").style.display="none";
  document.getElementById("premium").style.display="none";
}

function start(){
  hideAll();
  document.getElementById("test").style.display="block";
  load();
}

function load(){
  if(i >= qs.length){
    showResult();
    return;
  }

  document.getElementById("progress").innerText = "Soru " + (i+1) + " / " + qs.length;
  document.getElementById("q").innerText = qs[i].q;

  let html = "";
  qs[i].a.forEach(x=>{
    html += '<div class="option" onclick="next('+x[1]+')">'+x[0]+'</div>';
  });
  document.getElementById("a").innerHTML = html;
}

function next(val){
  score += val;
  i++;
  load();
}

function showResult(){
  hideAll();
  document.getElementById("result").style.display="block";

  let type = "Sosyal Lider";
  if(score <= 7) type = "Sessiz Gözlemci";
  if(score >= 15) type = "Enerji Kaynağı";

  document.getElementById("type").innerText = "%" + (70 + score) + " " + type;
  document.getElementById("count").innerText =
    "Seninle aynı sonucu alan " + (Math.floor(Math.random()*180)+35) + " kişi var 👀";
}

function premium(){
  hideAll();
  document.getElementById("premium").style.display="block";
}
</script>
</body>
</html>
