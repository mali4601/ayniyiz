<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sezgi mi Mantık mı? | Aynıyız</title><link rel="stylesheet" href="style.css"></head><body data-slug="sezgi-mi-mantik-mi"><div class="authModal" id="authModal"><div class="authCard glass"><h2>Giriş / Kayıt</h2><p>Yeni üyeye 4 kredi hediye.</p><input id="modalEmail" type="email" placeholder="E-mail"><input id="modalPassword" type="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button><button onclick="closeAuthModal()" style="background:rgba(255,255,255,.09)">Vazgeç</button></div></div><div class="app"><div class="top"><img src="logo.png" class="logo" alt="Aynıyız"><input class="search" placeholder="Test ara..."><div class="nav" id="userBox"><input type="email" id="email" placeholder="E-mail"><input type="password" id="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button></div></div><div class="quizWrap"><div class="quizCard glass"><img id="testIcon" class="quizLogo" src=""><div id="startScreen"><h1 id="testTitle"></h1><p id="testDesc"></p><div class="testStats"><span class="miniPill">15 soru</span><span class="miniPill">3 dk</span><span class="miniPill">1 kredi</span></div><button onclick="startTest()">Teste Başla</button><button onclick="location.href='testler.html'" style="background:rgba(255,255,255,.09)">Tüm Testlere Dön</button></div><div id="testScreen" class="hidden"><p id="counter"></p><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="answers"></div></div><div id="resultScreen" class="hidden result"><h1>Analizin Hazır ⚡</h1><div class="score" id="scoreText">0%</div><h2 id="resultTitle"></h2><p id="resultDesc"></p><div class="analysisBox"><b>V3 notu:</b> Bu alana aura tipi, güçlü yönler, risk alanları ve eşleşme önerisi gelecek.</div><div class="resultActions"><button onclick="saveResult()">Sonucumu Kaydet</button><button onclick="shareResult()">WhatsApp’ta Paylaş</button><button onclick="location.href='index.html'" style="background:rgba(255,255,255,.09)">Ana Sayfaya Dön</button><button onclick="location.href='kategori-iq.html'" style="background:rgba(255,255,255,.09)">Kategoriye Dön</button></div></div></div></div></div><script type="module" src="app.js"></script><script src="tests-data.js"></script><script>
const slug=document.body.dataset.slug,test=window.AYNIYIZ_TESTS.find(t=>t.slug===slug);let current=0,score=0;testIcon.src=test.icon;testTitle.innerText=test.title;testDesc.innerText=test.description+" Bu test 1 kredi kullanır.";
async function startTest(){const ok=await window.useCreditForTest();if(!ok)return;startScreen.classList.add("hidden");testScreen.classList.remove("hidden");loadQuestion()}
function loadQuestion(){if(current>=test.questions.length)return showResult();const q=test.questions[current];counter.innerText="Soru "+(current+1)+" / "+test.questions.length;bar.style.width=((current+1)/test.questions.length*100)+"%";question.innerText=q.q;answers.innerHTML=q.a.map(a=>`<div class="option" onclick="answer(${a.score})">${a.text}</div>`).join("")}
function answer(v){score+=v;current++;loadQuestion()}function showResult(){testScreen.classList.add("hidden");resultScreen.classList.remove("hidden");const percent=Math.round(score/(test.questions.length*4)*100),idx=Math.min(test.results.length-1,Math.floor(percent/26));scoreText.innerText=percent+"%";resultTitle.innerText=test.results[idx];resultDesc.innerText=`${test.title} sonucuna göre enerjin ${percent}% seviyesinde. Bu sonucu profilinde saklayabilir, paylaşabilir ve ileride aynı sonucu alan kişilerle eşleşebilirsin.`}
function saveResult(){window.saveQuizResult({test:test.title,slug:test.slug,category:test.category,result:resultTitle.innerText,percent:scoreText.innerText,createdAt:new Date().toISOString()})}
function shareResult(){const text=`Aynıyız testinde ${test.title} sonucumu öğrendim: ${resultTitle.innerText} ${scoreText.innerText}. Sen de çöz: https://ayniyiz.com/test-${test.slug}.html`;window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
</script></body></html>
