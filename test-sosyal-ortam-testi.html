<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sosyal Ortam Testi | Aynıyız</title><link rel="stylesheet" href="style.css"></head><body data-slug="sosyal-ortam-testi"><div class="app"><div class="quizWrap"><div class="quizCard glass"><img id="testIcon" class="quizLogo" src=""><div id="startScreen"><h1 id="testTitle"></h1><p id="testDesc"></p><button onclick="startTest()">Teste Başla</button><button onclick="location.href='index.html'">Ana Sayfa</button></div><div id="testScreen" class="hidden"><p id="counter"></p><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="answers"></div></div><div id="resultScreen" class="hidden result"><h1>Analizin Hazır ⚡</h1><div class="score" id="scoreText">0%</div><h2 id="resultTitle"></h2><p id="resultDesc"></p><button onclick="saveResult()">Sonucumu Kaydet</button><button onclick="shareResult()">WhatsApp’ta Paylaş</button><button onclick="location.href='index.html'">Yeni Test Çöz</button></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,setDoc,updateDoc,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAI31IV5RMxCLs5DiBaYjFVcHUFW5KDIeQ",authDomain:"ayniyiz-1a512.firebaseapp.com",projectId:"ayniyiz-1a512",storageBucket:"ayniyiz-1a512.firebasestorage.app",messagingSenderId:"926954313338",appId:"1:926954313338:web:006c9d26e7b8dae9860dc3",measurementId:"G-J6WPPNT26E"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
window.registerUser=async()=>{const email=document.getElementById("email")?.value,password=document.getElementById("password")?.value;if(!email||!password)return alert("E-mail ve şifre gir.");try{const u=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,"users",u.user.uid),{email,createdAt:new Date().toISOString(),premium:false,solvedTests:[]},{merge:true});alert("Kayıt başarılı ⚡")}catch(e){alert(e.message)}}
window.loginUser=async()=>{const email=document.getElementById("email")?.value,password=document.getElementById("password")?.value;if(!email||!password)return alert("E-mail ve şifre gir.");try{await signInWithEmailAndPassword(auth,email,password);alert("Giriş başarılı ⚡")}catch(e){alert(e.message)}}
window.logoutUser=async()=>signOut(auth);
window.saveQuizResult=async(payload)=>{const user=auth.currentUser;if(!user)return alert("Sonucu kaydetmek için önce giriş yapmalısın.");try{await updateDoc(doc(db,"users",user.uid),{solvedTests:arrayUnion(payload)});alert("Sonucun kaydedildi ⚡")}catch(e){alert(e.message)}}
onAuthStateChanged(auth,user=>{const box=document.getElementById("userBox");if(!box)return;if(user)box.innerHTML=`<div class="userEmail">${user.email}</div><button onclick="logoutUser()">Çıkış Yap</button>`;else box.innerHTML=`<input type="email" id="email" placeholder="E-mail"><input type="password" id="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button>`});
</script>

<script src="tests-data.js"></script><script>
const slug=document.body.dataset.slug,test=window.AYNIYIZ_TESTS.find(t=>t.slug===slug);let current=0,score=0;testIcon.src=test.icon;testTitle.innerText=test.title;testDesc.innerText=test.description+" Bu test 15 sorudan oluşur.";
function startTest(){startScreen.classList.add("hidden");testScreen.classList.remove("hidden");loadQuestion()}
function loadQuestion(){if(current>=test.questions.length)return showResult();const q=test.questions[current];counter.innerText="Soru "+(current+1)+" / "+test.questions.length;bar.style.width=((current+1)/test.questions.length*100)+"%";question.innerText=q.q;answers.innerHTML=q.a.map(a=>`<div class="option" onclick="answer(${a.score})">${a.text}</div>`).join("")}
function answer(v){score+=v;current++;loadQuestion()}
function showResult(){testScreen.classList.add("hidden");resultScreen.classList.remove("hidden");const percent=Math.round(score/(test.questions.length*4)*100),idx=Math.min(test.results.length-1,Math.floor(percent/26));scoreText.innerText=percent+"%";resultTitle.innerText=test.results[idx];resultDesc.innerText=`${test.title} sonucuna göre enerjin ${percent}% seviyesinde. Bu sonucu profilinde saklayabilir, paylaşabilir ve ileride aynı sonucu alan kişilerle eşleşebilirsin.`}
function saveResult(){window.saveQuizResult({test:test.title,slug:test.slug,category:test.category,result:resultTitle.innerText,percent:scoreText.innerText,createdAt:new Date().toISOString()})}
function shareResult(){const text=`Aynıyız testinde ${test.title} sonucumu öğrendim: ${resultTitle.innerText} ${scoreText.innerText}. Sen de çöz: https://ayniyiz.com/test-${test.slug}.html`;window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
</script>
</body></html>
