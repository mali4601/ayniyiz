<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Enerjin Ne Renk? | Aynıyız</title><link rel="stylesheet" href="style.css"></head><body data-slug="enerjin-ne-renk"><div class="authModal" id="authModal"><div class="authCard glass"><h2>Sonucunu kaydetmek için giriş yap</h2><p>Giriş yaptıktan sonra sonucun otomatik olarak profiline kaydedilecek.</p><input id="modalEmail" type="email" placeholder="E-mail"><input id="modalPassword" type="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button><button onclick="closeAuthModal()" style="background:rgba(255,255,255,.09)">Vazgeç</button></div></div><div class="app"><div class="quizWrap"><div class="quizCard glass"><img id="testIcon" class="quizLogo" src=""><div id="startScreen"><h1 id="testTitle"></h1><p id="testDesc"></p><div class="testStats" style="justify-content:center"><span class="miniPill">15 soru</span><span class="miniPill">3 dk</span><span class="miniPill">Ödeme entegrasyonu hariç</span></div><button onclick="startTest()">Teste Başla</button><button onclick="location.href='index.html'" style="background:rgba(255,255,255,.09)">Ana Sayfa</button></div><div id="testScreen" class="hidden"><p id="counter"></p><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="answers"></div></div><div id="resultScreen" class="hidden result"><h1>Analizin Hazır ⚡</h1><div class="score" id="scoreText">0%</div><h2 id="resultTitle"></h2><p id="resultDesc"></p><div class="analysisBox"><b>V3 notu:</b> Bu alana aura tipi, güçlü yönler, risk alanları ve eşleşme önerisi gelecek.</div><div class="resultActions"><button onclick="saveResult()">Sonucumu Kaydet</button><button onclick="shareResult()">WhatsApp’ta Paylaş</button><button onclick="location.href='index.html'" style="background:rgba(255,255,255,.09)">Ana Sayfaya Dön</button><button onclick="location.href='kategori-eglence.html'" style="background:rgba(255,255,255,.09)">Kategoriye Dön</button></div></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,setDoc,updateDoc,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAI31IV5RMxCLs5DiBaYjFVcHUFW5KDIeQ",authDomain:"ayniyiz-1a512.firebaseapp.com",projectId:"ayniyiz-1a512",storageBucket:"ayniyiz-1a512.firebasestorage.app",messagingSenderId:"926954313338",appId:"1:926954313338:web:006c9d26e7b8dae9860dc3",measurementId:"G-J6WPPNT26E"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);window.pendingResult=null;
window.registerUser=async()=>{const email=document.getElementById("email")?.value||document.getElementById("modalEmail")?.value,password=document.getElementById("password")?.value||document.getElementById("modalPassword")?.value;if(!email||!password)return alert("E-mail ve şifre gir.");try{const u=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,"users",u.user.uid),{email,createdAt:new Date().toISOString(),premium:false,solvedTests:[]},{merge:true});alert("Kayıt başarılı ⚡");closeAuthModal();if(window.pendingResult){await window.saveQuizResult(window.pendingResult);window.pendingResult=null}}catch(e){alert(e.message)}}
window.loginUser=async()=>{const email=document.getElementById("email")?.value||document.getElementById("modalEmail")?.value,password=document.getElementById("password")?.value||document.getElementById("modalPassword")?.value;if(!email||!password)return alert("E-mail ve şifre gir.");try{await signInWithEmailAndPassword(auth,email,password);alert("Giriş başarılı ⚡");closeAuthModal();if(window.pendingResult){await window.saveQuizResult(window.pendingResult);window.pendingResult=null}}catch(e){alert(e.message)}}
window.logoutUser=async()=>signOut(auth);window.openAuthModal=()=>document.getElementById("authModal")?.classList.add("show");window.closeAuthModal=()=>document.getElementById("authModal")?.classList.remove("show");
window.saveQuizResult=async(payload)=>{const user=auth.currentUser;if(!user){window.pendingResult=payload;openAuthModal();return}try{await updateDoc(doc(db,"users",user.uid),{solvedTests:arrayUnion(payload)});alert("Sonucun kaydedildi ⚡")}catch(e){alert(e.message)}}
onAuthStateChanged(auth,user=>{const box=document.getElementById("userBox");if(!box)return;if(user)box.innerHTML=`<div class="userEmail">${user.email}</div><button onclick="logoutUser()">Çıkış Yap</button>`;else box.innerHTML=`<input type="email" id="email" placeholder="E-mail"><input type="password" id="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button>`});
</script>

<script src="tests-data.js"></script><script>
const slug=document.body.dataset.slug,test=window.AYNIYIZ_TESTS.find(t=>t.slug===slug);let current=0,score=0;testIcon.src=test.icon;testTitle.innerText=test.title;testDesc.innerText=test.description+" Bu sayfa hazır. Sorular daha sonra tests-data.js içine eklenecek.";
function startTest(){if(!test.questions||test.questions.length===0){alert("Bu testin özgün soruları henüz eklenmedi. İçerik paketi tamamlanınca burası otomatik çalışacak.");return}startScreen.classList.add("hidden");testScreen.classList.remove("hidden");loadQuestion()}
function loadQuestion(){if(current>=test.questions.length)return showResult();const q=test.questions[current];counter.innerText="Soru "+(current+1)+" / "+test.questions.length;bar.style.width=((current+1)/test.questions.length*100)+"%";question.innerText=q.q;answers.innerHTML=q.a.map(a=>`<div class="option" onclick="answer(${a.score})">${a.text}</div>`).join("")}
function answer(v){score+=v;current++;loadQuestion()}function showResult(){testScreen.classList.add("hidden");resultScreen.classList.remove("hidden");const percent=Math.round(score/(test.questions.length*4)*100);scoreText.innerText=percent+"%";resultTitle.innerText="Aura Analizi";resultDesc.innerText=`${test.title} sonucuna göre enerjin ${percent}% seviyesinde. Detaylı analiz sistemi V3 içinde güçlendirilecek.`}
function saveResult(){window.saveQuizResult({test:test.title,slug:test.slug,category:test.category,result:resultTitle.innerText,percent:scoreText.innerText,createdAt:new Date().toISOString()})}
function shareResult(){const text=`Aynıyız testinde ${test.title} sonucumu öğrendim. Sen de çöz: https://ayniyiz.com/test-${test.slug}.html`;window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
</script>
</body></html>
