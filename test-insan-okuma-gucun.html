<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>İnsan Okuma Gücün | Aynıyız</title><link rel="stylesheet" href="style.css"></head><body data-slug="insan-okuma-gucun"><div class="authModal" id="authModal"><div class="authCard glass"><h2>Giriş / Kayıt</h2><p>Yeni üyeye 4 kredi hediye. Giriş yaptıktan sonra kaldığın yerden devam edeceksin.</p><input id="modalEmail" type="email" placeholder="E-mail"><input id="modalPassword" type="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button><button onclick="closeAuthModal()" style="background:rgba(255,255,255,.09)">Vazgeç</button></div></div><div class="app"><div class="top"><img src="logo.png" class="logo" alt="Aynıyız"><input class="search" placeholder="Test ara..."><div class="nav" id="userBox"><input type="email" id="email" placeholder="E-mail"><input type="password" id="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button></div></div><div class="quizWrap"><div class="quizCard glass"><img id="testIcon" class="quizLogo" src=""><div id="startScreen"><h1 id="testTitle"></h1><p id="testDesc"></p><div class="testStats"><span class="miniPill">15 soru</span><span class="miniPill">3 dk</span><span class="miniPill">1 kredi</span></div><button onclick="startTest()">Teste Başla</button><button onclick="location.href='testler.html'" style="background:rgba(255,255,255,.09)">Tüm Testlere Dön</button></div><div id="testScreen" class="hidden"><p id="counter"></p><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="answers"></div></div><div id="resultScreen" class="hidden result"><h1>Analizin Hazır ⚡</h1><div class="score" id="scoreText">0%</div><h2 id="resultTitle"></h2><p id="resultDesc"></p><div class="analysisBox"><b>V3 notu:</b> Bu alana aura tipi, güçlü yönler, risk alanları ve eşleşme önerisi gelecek.</div><div class="resultActions"><button onclick="saveResult()">Sonucumu Kaydet</button><button onclick="shareResult()">WhatsApp’ta Paylaş</button><button onclick="location.href='index.html'" style="background:rgba(255,255,255,.09)">Ana Sayfaya Dön</button><button onclick="location.href='kategori-sosyal.html'" style="background:rgba(255,255,255,.09)">Kategoriye Dön</button></div></div></div></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,doc,setDoc,getDoc,updateDoc,increment,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyAI31IV5RMxCLs5DiBaYjFVcHUFW5KDIeQ",authDomain:"ayniyiz-1a512.firebaseapp.com",projectId:"ayniyiz-1a512",storageBucket:"ayniyiz-1a512.firebasestorage.app",messagingSenderId:"926954313338",appId:"1:926954313338:web:006c9d26e7b8dae9860dc3",measurementId:"G-J6WPPNT26E"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);window.currentUser=null;window.pendingResult=null;
async function ensureUserDoc(user){const ref=doc(db,"users",user.uid);const snap=await getDoc(ref);if(!snap.exists()){await setDoc(ref,{email:user.email,credits:4,welcomeCreditsGiven:true,createdAt:new Date().toISOString(),solvedTests:[]},{merge:true})}else if(snap.data().credits===undefined){await updateDoc(ref,{credits:4,welcomeCreditsGiven:true})}}
window.refreshCredits=async()=>{if(!window.currentUser)return;const snap=await getDoc(doc(db,"users",window.currentUser.uid));const credits=snap.exists()?(snap.data().credits||0):0;document.querySelectorAll(".creditBadge").forEach(b=>b.innerText="⚡ Kredin: "+credits)}
window.registerUser=async()=>{const email=document.getElementById("email")?.value||document.getElementById("modalEmail")?.value,password=document.getElementById("password")?.value||document.getElementById("modalPassword")?.value;if(!email||!password)return alert("E-mail ve şifre gir.");try{const u=await createUserWithEmailAndPassword(auth,email,password);await ensureUserDoc(u.user);alert("Kayıt başarılı ⚡ 4 kredi hesabına tanımlandı.");closeAuthModal();if(window.pendingResult){await window.saveQuizResult(window.pendingResult);window.pendingResult=null}}catch(e){alert(e.message)}}
window.loginUser=async()=>{const email=document.getElementById("email")?.value||document.getElementById("modalEmail")?.value,password=document.getElementById("password")?.value||document.getElementById("modalPassword")?.value;if(!email||!password)return alert("E-mail ve şifre gir.");try{await signInWithEmailAndPassword(auth,email,password);alert("Giriş başarılı ⚡");closeAuthModal();if(window.pendingResult){await window.saveQuizResult(window.pendingResult);window.pendingResult=null}}catch(e){alert(e.message)}}
window.logoutUser=async()=>signOut(auth);window.openAuthModal=()=>document.getElementById("authModal")?.classList.add("show");window.closeAuthModal=()=>document.getElementById("authModal")?.classList.remove("show");
window.addCredits=async(amount)=>{if(!window.currentUser){openAuthModal();return}await updateDoc(doc(db,"users",window.currentUser.uid),{credits:increment(amount)});await refreshCredits()}
window.buyCredits=async(amount,price)=>{const ok=confirm(amount+" kredi / "+price+" TL paketini almak istiyor musun?");if(!ok)return;await addCredits(amount);alert(amount+" kredi hesabına eklendi ⚡")}
window.useCreditForTest=async()=>{if(!window.currentUser){openAuthModal();return false}const ref=doc(db,"users",window.currentUser.uid);const snap=await getDoc(ref);const credits=snap.exists()?(snap.data().credits||0):0;if(credits<1){alert("Yeterli kredin yok. Kredi yükleme sayfasına yönlendiriliyorsun.");location.href="kredi.html";return false}await updateDoc(ref,{credits:increment(-1)});await refreshCredits();return true}
window.saveQuizResult=async(payload)=>{const user=auth.currentUser;if(!user){window.pendingResult=payload;openAuthModal();return}try{await updateDoc(doc(db,"users",user.uid),{solvedTests:arrayUnion(payload)});alert("Sonucun kaydedildi ⚡")}catch(e){alert(e.message)}}
onAuthStateChanged(auth,async user=>{window.currentUser=user;const box=document.getElementById("userBox");if(user){await ensureUserDoc(user);if(box)box.innerHTML=`<div class="creditBadge">⚡ Kredin: ...</div><div class="userEmail">${user.email}</div><button onclick="logoutUser()">Çıkış Yap</button>`;await refreshCredits()}else{document.querySelectorAll(".creditBadge").forEach(b=>b.innerText="⚡ Giriş yap");if(box)box.innerHTML=`<input type="email" id="email" placeholder="E-mail"><input type="password" id="password" placeholder="Şifre"><button onclick="loginUser()">Giriş Yap</button><button onclick="registerUser()">Kayıt Ol</button>`}});
</script>

<script src="tests-data.js"></script><script>
const slug=document.body.dataset.slug,test=window.AYNIYIZ_TESTS.find(t=>t.slug===slug);let current=0,score=0;testIcon.src=test.icon;testTitle.innerText=test.title;testDesc.innerText=test.description+" Bu test 1 kredi kullanır.";
async function startTest(){const ok=await window.useCreditForTest();if(!ok)return;startScreen.classList.add("hidden");testScreen.classList.remove("hidden");loadQuestion()}
function loadQuestion(){if(current>=test.questions.length)return showResult();const q=test.questions[current];counter.innerText="Soru "+(current+1)+" / "+test.questions.length;bar.style.width=((current+1)/test.questions.length*100)+"%";question.innerText=q.q;answers.innerHTML=q.a.map(a=>`<div class="option" onclick="answer(${a.score})">${a.text}</div>`).join("")}
function answer(v){score+=v;current++;loadQuestion()}
function showResult(){testScreen.classList.add("hidden");resultScreen.classList.remove("hidden");const percent=Math.round(score/(test.questions.length*4)*100),idx=Math.min(test.results.length-1,Math.floor(percent/26));scoreText.innerText=percent+"%";resultTitle.innerText=test.results[idx];resultDesc.innerText=`${test.title} sonucuna göre enerjin ${percent}% seviyesinde. Bu sonucu profilinde saklayabilir, paylaşabilir ve ileride aynı sonucu alan kişilerle eşleşebilirsin.`}
function saveResult(){window.saveQuizResult({test:test.title,slug:test.slug,category:test.category,result:resultTitle.innerText,percent:scoreText.innerText,createdAt:new Date().toISOString()})}
function shareResult(){const text=`Aynıyız testinde ${test.title} sonucumu öğrendim: ${resultTitle.innerText} ${scoreText.innerText}. Sen de çöz: https://ayniyiz.com/test-${test.slug}.html`;window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank")}
</script>
</body></html>
