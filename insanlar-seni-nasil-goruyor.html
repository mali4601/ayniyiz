<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İnsanlar Seni Nasıl Görüyor? | Aynıyız</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  color:white;
  background:
    radial-gradient(circle at top left,#3d0b4f,transparent 30%),
    radial-gradient(circle at top right,#27114f,transparent 30%),
    #070812;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  padding:28px;
  backdrop-filter:blur(18px);
  box-shadow:0 0 45px rgba(255,47,159,.18);
}

.logo{
  width:190px;
  display:block;
  margin:0 auto 18px;
}

h1{
  font-size:30px;
  text-align:center;
  margin-bottom:12px;
}

p{
  color:#cfc7dd;
  text-align:center;
  line-height:1.5;
}

.progress{
  height:10px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  overflow:hidden;
  margin:22px 0;
}

.bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff2f9f,#7a35ff);
  transition:.3s;
}

.question{
  font-size:24px;
  font-weight:900;
  margin-bottom:18px;
}

.option{
  padding:16px;
  border-radius:18px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);
  margin-bottom:12px;
  cursor:pointer;
  transition:.2s;
}

.option:hover{
  background:rgba(255,47,159,.16);
  border-color:#ff63c2;
}

button{
  width:100%;
  border:0;
  border-radius:18px;
  padding:16px;
  color:white;
  font-weight:900;
  cursor:pointer;
  margin-top:12px;
  background:linear-gradient(135deg,#ff2f9f,#7a35ff);
  box-shadow:0 0 26px rgba(255,47,159,.32);
}

.result{
  text-align:center;
}

.score{
  width:160px;
  height:160px;
  border-radius:50%;
  margin:22px auto;
  display:grid;
  place-items:center;
  font-size:42px;
  font-weight:900;
  background:conic-gradient(#ff2f9f 0 87%,rgba(255,255,255,.12) 87%);
  box-shadow:0 0 45px rgba(255,47,159,.35);
}

.hidden{display:none}
</style>
</head>

<body>

<div class="card">

  <img src="logo.png" class="logo" alt="Aynıyız Logo">

  <div id="startScreen">
    <h1>İnsanlar Seni Nasıl Görüyor?</h1>
    <p>12 soruluk sosyal algı testini çöz. İnsanların sende ilk gördüğü enerjiyi öğren.</p>
    <button onclick="startTest()">Teste Başla</button>
  </div>

  <div id="testScreen" class="hidden">
    <p id="counter"></p>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="question" id="question"></div>
    <div id="answers"></div>
  </div>

  <div id="resultScreen" class="hidden result">
    <h1>Analizin Hazır ⚡</h1>
    <div class="score" id="scoreText">87%</div>
    <h2 id="resultTitle"></h2>
    <p id="resultDesc"></p>

    <button onclick="saveResult()">Sonucumu Kaydet</button>
    <button onclick="shareResult()">WhatsApp'ta Paylaş</button>
    <button onclick="location.href='index.html'">Yeni Test Çöz</button>
  </div>

</div>

<script>
let current = 0;
let score = 0;

const questions = [
  {
    q:"Kalabalık bir ortama girdiğinde genelde ne olur?",
    a:[
      ["Ortamın enerjisi yükselir",3],
      ["İnsanlar seni izler ama yaklaşmaz",2],
      ["Sessizce gözlemlersin",1],
      ["İnsanlar sana dert anlatır",2]
    ]
  },
  {
    q:"Bir arkadaşın seni tek kelimeyle anlatacak olsa?",
    a:[
      ["Enerjik",3],
      ["Gizemli",2],
      ["Mantıklı",2],
      ["Güvenilir",3]
    ]
  },
  {
    q:"Tartışma ortamında genelde nasıl davranırsın?",
    a:[
      ["Liderliği alırım",3],
      ["Sessiz kalırım",1],
      ["Mantıklı çözüm ararım",2],
      ["Ortamı yumuşatırım",3]
    ]
  },
  {
    q:"İnsanlar senden en çok ne bekler?",
    a:[
      ["Eğlence",3],
      ["Tavsiye",2],
      ["Çözüm",2],
      ["Destek",3]
    ]
  },
  {
    q:"İlk izlenimde nasıl görünürsün?",
    a:[
      ["Karizmatik",3],
      ["Soğuk",1],
      ["Akıllı",2],
      ["Samimi",3]
    ]
  },
  {
    q:"Hangi cümle sana daha yakın?",
    a:[
      ["Ben ortam insanıyım",3],
      ["Herkese hemen güvenmem",1],
      ["Önce düşünürüm",2],
      ["İnsanları kırmamaya çalışırım",3]
    ]
  },
  {
    q:"Bir ortamda dikkatini ne çeker?",
    a:[
      ["İnsanların enerjisi",3],
      ["Davranışları",2],
      ["Mantıksız hareketler",1],
      ["Duygusal atmosfer",2]
    ]
  },
  {
    q:"İnsanlar senden neden çekinebilir?",
    a:[
      ["Fazla özgüvenli görünmem",3],
      ["Gizemli olmam",2],
      ["Sert mantığım",1],
      ["Fazla dobra olmam",2]
    ]
  },
  {
    q:"Yakın çevren sana en çok ne anlatır?",
    a:[
      ["Eğlenceli olaylar",3],
      ["Gizli konular",2],
      ["Problemler",2],
      ["Duygusal meseleler",3]
    ]
  },
  {
    q:"Bir grubun içinde rolün nedir?",
    a:[
      ["Lider",3],
      ["Gözlemci",1],
      ["Planlayıcı",2],
      ["Arabulucu",3]
    ]
  },
  {
    q:"En güçlü yönün hangisi?",
    a:[
      ["Karizma",3],
      ["Sezgi",2],
      ["Zeka",2],
      ["Empati",3]
    ]
  },
  {
    q:"İnsanlar seni kaybetmekten neden korkar?",
    a:[
      ["Enerjim yüzünden",3],
      ["Güven verdiğim için",3],
      ["Akıllı olduğum için",2],
      ["Sadık olduğum için",3]
    ]
  }
];

function startTest(){
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("testScreen").classList.remove("hidden");
  loadQuestion();
}

function loadQuestion(){
  if(current >= questions.length){
    showResult();
    return;
  }

  document.getElementById("counter").innerText = "Soru " + (current+1) + " / " + questions.length;
  document.getElementById("bar").style.width = ((current+1) / questions.length * 100) + "%";
  document.getElementById("question").innerText = questions[current].q;

  let html = "";
  questions[current].a.forEach(item=>{
    html += `<div class="option" onclick="answer(${item[1]})">${item[0]}</div>`;
  });

  document.getElementById("answers").innerHTML = html;
}

function answer(value){
  score += value;
  current++;
  loadQuestion();
}

function showResult(){
  document.getElementById("testScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");

  let percent = Math.min(98, 55 + score);
  document.getElementById("scoreText").innerText = percent + "%";

  let title = "";
  let desc = "";

  if(score <= 20){
    title = "Sessiz Gözlemci";
    desc = "İnsanlar seni sakin, derin düşünen ve kolay kolay çözülemeyen biri olarak görüyor.";
  }else if(score <= 29){
    title = "Güven Veren Karakter";
    desc = "İnsanlar yanında rahatlıyor. Sende samimiyet, denge ve güven hissi güçlü.";
  }else{
    title = "Pozitif İzlenim";
    desc = "İnsanlar seni enerjik, dikkat çeken ve ortamın havasını değiştiren biri olarak görüyor.";
  }

  document.getElementById("resultTitle").innerText = title;
  document.getElementById("resultDesc").innerText = desc;
}

function saveResult(){
  alert("Sonuç kaydetme Firebase'e bağlanacak.");
}

function shareResult(){
  const text = "Ben Aynıyız testinde sonucumu öğrendim. Sen de çöz: https://ayniyiz.com";
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
</script>

</body>
</html>
